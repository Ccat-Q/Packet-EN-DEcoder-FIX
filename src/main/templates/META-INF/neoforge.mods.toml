# This file is a template processed by the generateModMetadata task at build time.
# The actual neoforge.mods.toml lands in build/generated/sources/modMetadata/META-INF/neoforge.mods.toml
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/Ccat-Q/Packet-EN-DEcoder-FIX/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
#displayURL="https://github.com/Ccat-Q/Packet-EN-DEcoder-FIX"
authors="${mod_authors}" #optional
description='''${mod_description}'''

# Declare our mixin config so FML loads it on BOTH client and server.
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]] #optional
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"